# Portainer → Stacks → Add stack → "Web editor": plak dit bestand.
# Gebruikt de kant-en-klare image die GitHub Actions bouwt (amd64 + arm64).
# Er hoeft niets ingevuld te worden: log na het deployen in met admin / admin.

services:
  huishoudboekje:
    image: ghcr.io/richrdj/huishoudboekje:latest
    container_name: huishoudboekje
    restart: unless-stopped
    ports:
      - "9393:8080"   # links de poort op je server, pas aan als 9393 al bezet is
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - huishoudboekje-data:/data

volumes:
  huishoudboekje-data:
