# Portainer → Stacks → Add stack → "Repository"
#   Repository URL:  https://github.com/RichrdJ/huishoudboekje
#   Compose path:    docker-compose.yml
# Portainer bouwt de image dan zelf uit deze repository.
# Er hoeft niets ingevuld te worden: log na het deployen in met admin / admin.

services:
  huishoudboekje:
    build: .
    image: huishoudboekje:local
    container_name: huishoudboekje
    restart: unless-stopped
    ports:
      - "8080:8080"   # links de poort op je server, pas aan als 8080 al bezet is
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - huishoudboekje-data:/data

volumes:
  huishoudboekje-data:
